<!DOCTYPE html>
<html lang="en" data-maqder-updating="1">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta http-equiv="refresh" content="12" />
  <meta name="theme-color" content="#f4f6f3" />
  <title>Maqder is updating</title>
  <link rel="icon" type="image/png" href="/MaqderFavicon.png" />
  <link rel="apple-touch-icon" href="/MaqderFavicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #f4f6f3;
      --ink: #12241c;
      --muted: #5b6b63;
      --line: rgba(18, 36, 28, .08);
      --green: #1a3d28;
      --emerald: #059669;
      --gold: #b8860b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: "DM Sans", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(720px 380px at 50% -8%, rgba(5, 150, 105, .09), transparent 58%),
        linear-gradient(180deg, #fbfcfb 0%, var(--paper) 100%);
      display: grid;
      place-items: center;
      padding: 32px 18px;
    }
    body::before {
      content: "";
      position: fixed; inset: 0; pointer-events: none;
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse at center, #000 30%, transparent 78%);
    }
    .card {
      position: relative;
      width: min(480px, 100%);
      background: rgba(255,255,255,.88);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 28px;
      padding: 44px 36px 36px;
      text-align: center;
      box-shadow:
        0 1px 0 rgba(255,255,255,.9) inset,
        0 24px 60px -28px rgba(18, 36, 28, .28),
        0 8px 24px -16px rgba(18, 36, 28, .12);
    }
    .logo {
      width: min(300px, 86%);
      margin: 0 auto 28px;
      background: transparent;
    }
    .logo img { width: 100%; height: auto; display: block; }
    .kicker {
      color: var(--emerald);
      font-size: 11px;
      letter-spacing: .32em;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 12px;
    }
    h1 {
      font-family: Outfit, sans-serif;
      font-size: clamp(28px, 5vw, 36px);
      font-weight: 700;
      letter-spacing: -.035em;
      line-height: 1.12;
      margin-bottom: 12px;
    }
    .lead {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.65;
      max-width: 34ch;
      margin: 0 auto 28px;
    }
    .bar {
      height: 5px;
      border-radius: 99px;
      background: #e7ece8;
      overflow: hidden;
      margin: 0 auto 22px;
      width: min(260px, 78%);
    }
    .bar span {
      display: block; height: 100%; width: 42%;
      border-radius: 99px;
      background: linear-gradient(90deg, #047857, #10b981, #c9a227);
      animation: sweep 1.7s ease-in-out infinite;
    }
    @keyframes sweep {
      0% { transform: translateX(-130%); }
      100% { transform: translateX(280%); }
    }
    .wait {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 16px;
      border-radius: 999px;
      background: #ecfdf5;
      color: #047857;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .02em;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #10b981;
      animation: pulse 1.6s ease-out infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(16,185,129,.45); }
      70% { box-shadow: 0 0 0 8px rgba(16,185,129,0); }
      100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); }
    }
    .thanks {
      margin-top: 22px;
      font-size: 14.5px;
      font-weight: 600;
      color: var(--ink);
    }
    .contact {
      margin-top: 26px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      font-size: 13px;
      color: var(--muted);
    }
    .contact a {
      color: var(--green);
      text-decoration: none;
      font-weight: 600;
    }
    .contact a:hover { color: var(--emerald); }
    .retry {
      margin-top: 10px;
      font-size: 12px;
      color: #8a958f;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">
      <img src="/maqderbestlogo.png" alt="Maqder" />
    </div>
    <p class="kicker">System update</p>
    <h1>We’re refreshing the platform.</h1>
    <p class="lead">This usually takes 3–5 minutes. Your data is safe. Thank you for your patience.</p>
    <div class="bar" aria-hidden="true"><span></span></div>
    <div class="wait"><span class="dot"></span> Please wait</div>
    <p class="thanks">We’ll bring you back as soon as Maqder is ready.</p>
    <p class="contact">
      <a href="mailto:sales@maqder.com">sales@maqder.com</a>
      &nbsp;·&nbsp;
      <a href="tel:+966596775485">+966 59 677 5485</a>
    </p>
    <p class="retry">Refreshing automatically</p>
  </main>
  <script>
    (function () {
      var n = 12;
      var el = document.querySelector('.retry');
      function tick() {
        if (el) el.textContent = 'Refreshing in ' + n + 's';
        if (n <= 0) {
          window.location.reload();
          return;
        }
        n -= 1;
        setTimeout(tick, 1000);
      }
      tick();
    })();
  </script>
</body>
</html>
