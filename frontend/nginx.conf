# ─── Upstream pool ────────────────────────────────────────────────────────────
# Reuses TCP connections to the backend instead of opening a new one per
# request. 32 keepalive connections is plenty for a single-VPS deployment.
upstream backend_pool {
    server backend:3000;
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 65s;
}

# ─── Rate-limit zone for auth endpoints ───────────────────────────────────────
# Limits brute-force at the Nginx layer before the request even hits Node.
# 10 MB zone = ~160 000 tracked IPs; burst of 10 with no-delay.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ─── Security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"           always;
    add_header X-Frame-Options         "SAMEORIGIN"        always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;

    # Allow large image uploads (boutique products, logos, etc.)
    client_max_body_size 50M;

    # ─── Gzip compression ──────────────────────────────────────────────────────
    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff
        font/woff2;

    # ─── Proxy to backend (API) ────────────────────────────────────────────────
    location /api/ {
        # Brute-force protection on auth endpoints at Nginx layer
        location /api/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            limit_req_status 429;

            proxy_pass         http://backend_pool/api/auth/;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";   # required for upstream keepalive
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        proxy_pass         http://backend_pool/api/;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";   # required for upstream keepalive
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Proxy buffering — Nginx buffers the backend response so it can
        # release the backend worker connection quickly, even for slow clients.
        proxy_buffering       on;
        proxy_buffer_size     8k;
        proxy_buffers         16 8k;
        proxy_busy_buffers_size 16k;

        # Timeouts — generous for long-running PDF/ZATCA operations
        proxy_read_timeout    300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
    }

    # ─── Socket.IO (real-time) ─────────────────────────────────────────────────
    # Without this block, /socket.io/ requests fall through to the SPA
    # try_files fallback below and get served index.html instead of reaching
    # the backend — silently breaking all real-time features. Client/server
    # are pinned to the websocket transport only (see lib/socket.js), so this
    # is always an Upgrade request — no sticky sessions needed across the
    # backend's cluster workers/replicas.
    location /socket.io/ {
        proxy_pass         http://backend_pool/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Long-lived connections — do not time out active sockets
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 10s;
    }

    # ─── Uploaded files ────────────────────────────────────────────────────────
    location /uploads/ {
        proxy_pass         http://backend_pool/uploads/;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Cache uploads for 30 days
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        proxy_hide_header Cache-Control;
    }

    # ─── Service worker, workbox runtime & manifest — NEVER CACHE ──────────────
    # Ensures browser always checks server for fresh Service Worker & updates
    location ~* (sw\.js|workbox-[a-f0-9]+\.js|manifest\.webmanifest|manifest\.json)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma        "no-cache"                                                          always;
        add_header Expires       "0"                                                                 always;
        expires off;
    }

    # ─── Exact index.html — NEVER CACHE ───────────────────────────────────────
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma        "no-cache"                                                          always;
        add_header Expires       "0"                                                                 always;
        expires off;
    }

    # ─── Hashed build assets — cache forever, but return 404 if missing ───────
    # Vite content-hashes every asset filename; if a requested chunk from an old
    # build is missing, return 404 immediately so frontend auto-recovers (never fallback to HTML).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        gzip_static on;
        try_files $uri =404;
    }

    # ─── Fonts & Static Images ────────────────────────────────────────────────
    location ~* \.(woff|woff2|ttf|eot|png|jpg|jpeg|gif|ico|svg)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # ─── SPA fallback ─────────────────────────────────────────────────────────
    # For HTML navigations (e.g. /invoices, /dashboard, /), always send no-cache
    # headers so browsers never cache the entry index.html shell.
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma        "no-cache"                                                          always;
        add_header Expires       "0"                                                                 always;
        try_files $uri $uri/ /index.html;
    }
}
