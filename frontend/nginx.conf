# ─── Upstream pool ────────────────────────────────────────────────────────────
# Reuses TCP connections to the backend instead of opening a new one per
# request. 32 keepalive connections is plenty for a single-VPS deployment.
upstream backend_pool {
    server backend:3000;
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 65s;
}

# ─── Rate-limit zone for auth endpoints ───────────────────────────────────────
# Limits brute-force at the Nginx layer before the request even hits Node.
# 10 MB zone = ~160 000 tracked IPs; burst of 10 with no-delay.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ─── Security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"           always;
    add_header X-Frame-Options         "SAMEORIGIN"        always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;

    # Allow large image uploads (boutique products, logos, etc.)
    client_max_body_size 50M;

    # ─── Gzip compression ──────────────────────────────────────────────────────
    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff
        font/woff2;

    # ─── Proxy to backend (API) ────────────────────────────────────────────────
    location /api/ {
        # Brute-force protection on auth endpoints at Nginx layer
        location /api/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            limit_req_status 429;

            proxy_pass         http://backend_pool/api/auth/;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";   # required for upstream keepalive
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        proxy_pass         http://backend_pool/api/;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";   # required for upstream keepalive
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Proxy buffering — Nginx buffers the backend response so it can
        # release the backend worker connection quickly, even for slow clients.
        proxy_buffering       on;
        proxy_buffer_size     8k;
        proxy_buffers         16 8k;
        proxy_busy_buffers_size 16k;

        # Timeouts — generous for long-running PDF/ZATCA operations
        proxy_read_timeout    300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
    }

    # ─── Uploaded files ────────────────────────────────────────────────────────
    # Serve with a 30-day cache header. Images are content-addressed once
    # uploaded so a long cache is safe, and Nginx serves them without hitting
    # the Node process at all.
    location /uploads/ {
        proxy_pass         http://backend_pool/uploads/;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Tell clients (and Cloudflare) to cache uploads for 30 days
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        proxy_hide_header Cache-Control;  # override whatever Node sends
    }

    # ─── Service worker & manifest — never cache ───────────────────────────────
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma        "no-cache"                            always;
        expires off;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma        "no-cache"                            always;
        expires off;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
    }

    # ─── Hashed build assets — cache forever ──────────────────────────────────
    # Vite content-hashes every asset filename; the hash changes whenever the
    # content changes so aggressive caching is safe.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        gzip_static on;  # serve pre-compressed .gz if available
    }

    # ─── SPA fallback ─────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
