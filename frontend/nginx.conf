# ─── Upstream pool ────────────────────────────────────────────────────────────
# Reuses TCP connections to the backend instead of opening a new one per
# request. 32 keepalive connections is plenty for a single-VPS deployment.
upstream backend_pool {
    server backend:3000;
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 65s;
}

# ─── Rate-limit zone for auth endpoints ───────────────────────────────────────
# Limits brute-force at the Nginx layer before the request even hits Node.
# 10 MB zone = ~160 000 tracked IPs; burst of 10 with no-delay.
# Auth brute-force shield at the edge. App Redis limiter is 40 req / 15 min
# (AUTH_RATE_LIMIT_MAX). Nginx stays coarser so legitimate retries work:
# 10/min with burst 20, then 429 before Node.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

# WebSocket upgrade mapping — empty Upgrade must not force Connection: upgrade
# on normal HTTP (breaks some proxies); real WS handshakes still upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Visitor IP when orange-clouded at Cloudflare (no-op if CF is not in front).
    include /etc/nginx/cloudflare-realip.conf;

    # Browser document navigations only — never remap /api or /socket.io to a
    # fake HTTP 200 HTML page (that breaks JSON clients and WS handshakes).
    error_page 502 503 504 =200 /updating.html;
    location = /updating.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # ─── Security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"           always;
    add_header X-Frame-Options         "SAMEORIGIN"        always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;

    # Allow large image uploads (boutique products, logos, etc.)
    client_max_body_size 50M;

    # ─── Gzip compression ──────────────────────────────────────────────────────
    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff
        font/woff2;

    # ─── Proxy to backend (API) ────────────────────────────────────────────────
    # Sibling locations — do not nest /api/auth/ inside /api/ (duplicate proxy_pass).
    location /api/auth/ {
        limit_req zone=auth_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass         http://backend_pool/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        # Pass real 502/503 to API clients — do not rewrite to updating.html 200
        proxy_intercept_errors off;
        error_page 502 503 504 = @api_unavailable;
        add_header Cache-Control "private, no-store" always;
    }

    location /api/ {
        proxy_pass         http://backend_pool/api/;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_buffering       on;
        proxy_buffer_size     8k;
        proxy_buffers         16 8k;
        proxy_busy_buffers_size 16k;

        proxy_read_timeout    300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_intercept_errors off;
        error_page 502 503 504 = @api_unavailable;
        add_header Cache-Control "private, no-store" always;
    }

    # ─── Socket.IO (real-time) ─────────────────────────────────────────────────
    # Without this block, /socket.io/ requests fall through to the SPA
    # try_files fallback below and get served index.html instead of reaching
    # the backend — silently breaking all real-time features. Client/server
    # are pinned to the websocket transport only (see lib/socket.js), so this
    # is always an Upgrade request — no sticky sessions needed across the
    # backend's cluster workers/replicas.
    #
    # CRITICAL: never remap upstream failures to HTTP 200 + HTML. Browsers then
    # report "WebSocket handshake: Unexpected response code: 200".
    location /socket.io/ {
        proxy_pass         http://backend_pool/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Long-lived connections — do not time out active sockets
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 10s;
        proxy_intercept_errors off;
        error_page 502 503 504 = @socket_unavailable;
    }

    location @api_unavailable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"error":"Service temporarily unavailable","code":"UPSTREAM_UNAVAILABLE"}';
    }

    location @socket_unavailable {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 503 "Service temporarily unavailable";
    }

    # ─── Uploaded files ────────────────────────────────────────────────────────
    # Sensitive prefixes must not be cached at the edge (tenant-gated).
    location /uploads/hr/ {
        proxy_pass         http://backend_pool/uploads/hr/;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header Cache-Control "private, no-store" always;
        proxy_hide_header Cache-Control;
    }

    location /uploads/expense-receipts/ {
        proxy_pass         http://backend_pool/uploads/expense-receipts/;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header Cache-Control "private, no-store" always;
        proxy_hide_header Cache-Control;
    }

    location /uploads/khayyat/ {
        proxy_pass         http://backend_pool/uploads/khayyat/;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header Cache-Control "private, no-store" always;
        proxy_hide_header Cache-Control;
    }

    location /uploads/purchase-orders/ {
        proxy_pass         http://backend_pool/uploads/purchase-orders/;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header Cache-Control "private, no-store" always;
        proxy_hide_header Cache-Control;
    }

    location /uploads/ {
        proxy_pass         http://backend_pool/uploads/;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Public catalog/branding — short cache, revalidate (logos get replaced)
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        proxy_hide_header Cache-Control;
    }

    # ─── Service worker, workbox runtime & manifest — NEVER CACHE ──────────────
    # Ensures browser always checks server for fresh Service Worker & updates
    location ~* (sw\.js|workbox-[a-f0-9]+\.js|manifest\.webmanifest|manifest\.json)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma        "no-cache"                                                          always;
        add_header Expires       "0"                                                                 always;
        expires off;
    }

    # ─── Exact index.html — NEVER CACHE ───────────────────────────────────────
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        add_header Pragma        "no-cache"                                                          always;
        add_header Expires       "0"                                                                 always;
        expires off;
    }

    # ─── Hashed build assets — cache forever, but return 404 if missing ───────
    # Vite content-hashes every asset filename; if a requested chunk from an old
    # build is missing, return 404 immediately so frontend auto-recovers (never fallback to HTML).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header CDN-Cache-Control "public, max-age=31536000, immutable" always;
        add_header Cloudflare-CDN-Cache-Control "public, max-age=31536000, immutable" always;
        gzip_static on;
        try_files $uri =404;
    }

    # ─── Fonts & Static Images ────────────────────────────────────────────────
    location ~* \.(woff|woff2|ttf|eot|png|jpg|jpeg|gif|ico|svg)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # ─── SPA fallback ─────────────────────────────────────────────────────────
    # For HTML navigations (e.g. /invoices, /dashboard, /), always send no-cache
    # headers so browsers never cache the entry index.html shell.
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma        "no-cache"                                                          always;
        add_header Expires       "0"                                                                 always;
        try_files $uri $uri/ /index.html;
    }
}
