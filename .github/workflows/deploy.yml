name: Deploy to Plesk

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # Never cancel an in-flight SSH deploy — that leaves partial rsync / docker builds.
  group: deploy-plesk
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Isolation, CSRF, money, SLO unit tests
        working-directory: backend
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write SSH key and known_hosts
        env:
          PLESK_SSH_KEY: ${{ secrets.PLESK_SSH_KEY }}
          PLESK_SSH_HOST_KEY: ${{ secrets.PLESK_SSH_HOST_KEY }}
        run: |
          python3 << 'PY'
          import os
          import pathlib

          home = pathlib.Path.home() / ".ssh"
          home.mkdir(mode=0o700, exist_ok=True)

          def normalize(raw: str) -> str:
              s = (raw or "").strip().strip('"').strip("'")
              s = s.replace("\r\n", "\n").replace("\r", "\n")
              if s.count("\n") < 2 and "\\n" in s:
                  s = s.replace("\\n", "\n")
              if s and not s.endswith("\n"):
                  s += "\n"
              return s

          key = normalize(os.environ.get("PLESK_SSH_KEY", ""))
          if "BEGIN" not in key or "PRIVATE KEY" not in key:
              raise SystemExit(
                  "PLESK_SSH_KEY must be a PEM/OpenSSH private key "
                  "(-----BEGIN OPENSSH PRIVATE KEY-----), not a .pub or PuTTY .ppk. "
                  "Paste the full private key into GitHub → Settings → Secrets → PLESK_SSH_KEY."
              )
          key_path = home / "plesk_deploy"
          key_path.write_text(key)
          key_path.chmod(0o600)

          host = normalize(os.environ.get("PLESK_SSH_HOST_KEY", ""))
          if host:
              known = home / "known_hosts"
              known.write_text(host)
              known.chmod(0o600)
          PY

      - name: Build app images (Actions has working DNS to Docker Hub)
        env:
          COMPOSE_PROJECT_NAME: maqder
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          touch .env
          export BUILD_SHA
          docker compose build backend frontend pdf-worker
          echo "=== saving images ==="
          docker save \
            maqder-backend:latest \
            maqder-frontend:latest \
            maqder-pdf-worker:latest \
            | gzip > /tmp/maqder-app-images.tar.gz
          ls -lh /tmp/maqder-app-images.tar.gz

      - name: Deploy to Plesk server
        env:
          SSH_USER: root
          SSH_HOST: ${{ secrets.PLESK_SSH_HOST || 'maqder.com' }}
          SSH_PORT: ${{ secrets.PLESK_SSH_PORT || '22' }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          case "$SSH_HOST" in
            *BEGIN*|*PRIVATE*|*----*)
              echo "PLESK_SSH_HOST is not a hostname (it looks like a key). Set it to maqder.com or the server IP only."
              exit 1
              ;;
          esac
          echo "Deploying to ${SSH_USER}@${SSH_HOST}:${SSH_PORT}"
          # Cloudflare (orange cloud) does not proxy SSH. Use the Plesk origin IP.
          if [ "$SSH_HOST" = "maqder.com" ] || [ "$SSH_HOST" = "www.maqder.com" ]; then
            SSH_HOST="87.237.228.159"
            echo "Rewrote host to origin IP ${SSH_HOST} (SSH cannot go through Cloudflare)."
          fi
          ssh-keyscan -p "${SSH_PORT}" "${SSH_HOST}" > "$HOME/.ssh/known_hosts" 2>/tmp/keyscan.err || true
          if [ ! -s "$HOME/.ssh/known_hosts" ]; then
            echo "ssh-keyscan failed:"
            cat /tmp/keyscan.err
            exit 1
          fi
          chmod 600 "$HOME/.ssh/known_hosts" "$HOME/.ssh/plesk_deploy"

          SSH_BASE=(
            -i "$HOME/.ssh/plesk_deploy"
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o ConnectTimeout=15
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=20
            -p "${SSH_PORT}"
          )
          REMOTE="${SSH_USER}@${SSH_HOST}"
          DEST="/var/www/vhosts/maqder.com/httpdocs"
          RSYNC_RSH="ssh -i $HOME/.ssh/plesk_deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o ConnectTimeout=15 -p ${SSH_PORT}"

          echo "=== rsync code to ${REMOTE}:${DEST} (sha=${BUILD_SHA}) ==="
          rsync -az --delete \
            -e "$RSYNC_RSH" \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude 'frontend/node_modules/' \
            --exclude 'backend/node_modules/' \
            --exclude 'frontend/dist/' \
            --exclude 'desktop/node_modules/' \
            --exclude 'backend/storage/' \
            --exclude 'backend/tmp/' \
            --exclude 'backend/logs/' \
            --exclude 'uploads/' \
            --exclude 'backups/' \
            --exclude 'tmp/' \
            --exclude 'logs/' \
            --exclude '.env' \
            --exclude '.env.local' \
            --exclude '.env.production' \
            --exclude '.cursor/' \
            --exclude 'maqder-app-images.tar.gz' \
            ./ "${REMOTE}:${DEST}/"

          echo "=== scp pre-built images ==="
          scp "${SSH_BASE[@]}" /tmp/maqder-app-images.tar.gz "${REMOTE}:/tmp/maqder-app-images.tar.gz"

          echo "=== remote deploy.sh (prebuilt images, no Docker Hub) ==="
          set +e
          ssh "${SSH_BASE[@]}" "${REMOTE}" \
            "cd '${DEST}' && chmod +x deploy.sh && SKIP_GIT=1 USE_PREBUILT_IMAGES=1 COMPOSE_PROJECT_NAME=maqder BUILD_SHA='${BUILD_SHA}' ./deploy.sh"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "Remote deploy exited ${status} (255 = SSH never started the script)."
            exit "$status"
          fi
          ssh "${SSH_BASE[@]}" "${REMOTE}" "rm -f /tmp/maqder-app-images.tar.gz" || true
