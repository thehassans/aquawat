name: Deploy to Plesk

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-plesk
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Isolation, CSRF, money, SLO unit tests
        working-directory: backend
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PLESK_SSH_KEY }}
          log-public-key: false

      - name: Add Plesk host key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PLESK_SSH_HOST_KEY }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to Plesk server
        env:
          SSH_USER: ${{ secrets.PLESK_SSH_USER || 'maqder.com_eucg0ssmgds' }}
          SSH_HOST: ${{ secrets.PLESK_SSH_HOST || 'maqder.com' }}
          SSH_PORT: ${{ secrets.PLESK_SSH_PORT || '22' }}
        run: |
          echo "Deploying to ${SSH_USER}@${SSH_HOST}:${SSH_PORT}"
          ssh -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" << 'EOF'
            set -e
            chmod +x /var/www/vhosts/maqder.com/httpdocs/deploy.sh
            /var/www/vhosts/maqder.com/httpdocs/deploy.sh
          EOF
