name: Deploy to Plesk

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # Never cancel an in-flight SSH deploy — that leaves partial rsync / docker builds.
  group: deploy-plesk
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Isolation, CSRF, money, SLO unit tests
        working-directory: backend
        run: npm test

  # Backend + frontend images build in parallel.
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - id: backend
            context: ./backend
            tag: maqder-backend:latest
            scope: maqder-backend
          - id: frontend
            context: ./frontend
            tag: maqder-frontend:latest
            scope: maqder-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.id }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: ${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}
          build-args: |
            BUILD_SHA=${{ github.sha }}

      - name: Pack image (zstd)
        run: |
          set -euo pipefail
          docker image inspect "${{ matrix.tag }}" >/dev/null
          docker save "${{ matrix.tag }}" | zstd -T0 -3 -o "/tmp/maqder-${{ matrix.id }}.tar.zst"
          ls -lh "/tmp/maqder-${{ matrix.id }}.tar.zst"

      - name: Upload ${{ matrix.id }} image
        uses: actions/upload-artifact@v4
        with:
          name: maqder-${{ matrix.id }}-image
          path: /tmp/maqder-${{ matrix.id }}.tar.zst
          retention-days: 1
          compression-level: 0

  deploy:
    needs: [test, build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download backend image
        uses: actions/download-artifact@v4
        with:
          name: maqder-backend-image
          path: /tmp/images

      - name: Download frontend image
        uses: actions/download-artifact@v4
        with:
          name: maqder-frontend-image
          path: /tmp/images

      - name: Write SSH key and known_hosts
        env:
          PLESK_SSH_KEY: ${{ secrets.PLESK_SSH_KEY }}
          PLESK_SSH_HOST_KEY: ${{ secrets.PLESK_SSH_HOST_KEY }}
        run: |
          python3 << 'PY'
          import os
          import pathlib

          home = pathlib.Path.home() / ".ssh"
          home.mkdir(mode=0o700, exist_ok=True)

          def normalize(raw: str) -> str:
              s = (raw or "").strip().strip('"').strip("'")
              s = s.replace("\r\n", "\n").replace("\r", "\n")
              if s.count("\n") < 2 and "\\n" in s:
                  s = s.replace("\\n", "\n")
              if s and not s.endswith("\n"):
                  s += "\n"
              return s

          key = normalize(os.environ.get("PLESK_SSH_KEY", ""))
          if "BEGIN" not in key or "PRIVATE KEY" not in key:
              raise SystemExit(
                  "PLESK_SSH_KEY must be a PEM/OpenSSH private key "
                  "(-----BEGIN OPENSSH PRIVATE KEY-----), not a .pub or PuTTY .ppk. "
                  "Paste the full private key into GitHub → Settings → Secrets → PLESK_SSH_KEY."
              )
          key_path = home / "plesk_deploy"
          key_path.write_text(key)
          key_path.chmod(0o600)

          host = normalize(os.environ.get("PLESK_SSH_HOST_KEY", ""))
          if host:
              known = home / "known_hosts"
              known.write_text(host)
              known.chmod(0o600)
          PY

      - name: Deploy to Plesk server
        env:
          SSH_USER: root
          SSH_HOST: ${{ secrets.PLESK_SSH_HOST || 'maqder.com' }}
          SSH_PORT: ${{ secrets.PLESK_SSH_PORT || '22' }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          case "$SSH_HOST" in
            *BEGIN*|*PRIVATE*|*----*)
              echo "PLESK_SSH_HOST is not a hostname (it looks like a key). Set it to maqder.com or the server IP only."
              exit 1
              ;;
          esac
          echo "Deploying to ${SSH_USER}@${SSH_HOST}:${SSH_PORT}"
          # Cloudflare (orange cloud) does not proxy SSH. Use the Plesk origin IP.
          if [ "$SSH_HOST" = "maqder.com" ] || [ "$SSH_HOST" = "www.maqder.com" ]; then
            SSH_HOST="87.237.228.159"
            echo "Rewrote host to origin IP ${SSH_HOST} (SSH cannot go through Cloudflare)."
          fi
          ssh-keyscan -p "${SSH_PORT}" "${SSH_HOST}" > "$HOME/.ssh/known_hosts" 2>/tmp/keyscan.err || true
          if [ ! -s "$HOME/.ssh/known_hosts" ]; then
            echo "ssh-keyscan failed:"
            cat /tmp/keyscan.err
            exit 1
          fi
          chmod 600 "$HOME/.ssh/known_hosts" "$HOME/.ssh/plesk_deploy"

          # Fast path for large binary blobs: no SSH Compression, no rsync -z
          # (re-gzipping a .zst burns CPU and looks "stuck" for 1GB+ transfers).
          SSH_FAST=(
            -i "$HOME/.ssh/plesk_deploy"
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o Compression=no
            -o Ciphers=aes128-gcm@openssh.com,chacha20-poly1305@openssh.com,aes128-ctr
            -o ConnectTimeout=15
            -o ServerAliveInterval=20
            -o ServerAliveCountMax=30
            -p "${SSH_PORT}"
          )
          SSH_BASE=(
            -i "$HOME/.ssh/plesk_deploy"
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o ConnectTimeout=15
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=20
            -p "${SSH_PORT}"
          )
          REMOTE="${SSH_USER}@${SSH_HOST}"
          DEST="/var/www/vhosts/maqder.com/httpdocs"
          # Explicit string (array join breaks rsync -e quoting)
          RSYNC_IMG_RSH="ssh -i $HOME/.ssh/plesk_deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o Compression=no -o Ciphers=aes128-gcm@openssh.com,chacha20-poly1305@openssh.com,aes128-ctr -o ConnectTimeout=15 -o ServerAliveInterval=20 -o ServerAliveCountMax=30 -p ${SSH_PORT}"
          RSYNC_CODE_RSH="ssh -i $HOME/.ssh/plesk_deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o ConnectTimeout=15 -p ${SSH_PORT}"

          BACK_ZST="$(find /tmp/images -name 'maqder-backend.tar.zst' -type f | head -1)"
          FRONT_ZST="$(find /tmp/images -name 'maqder-frontend.tar.zst' -type f | head -1)"
          if [ -z "${BACK_ZST}" ] || [ ! -f "${BACK_ZST}" ] || [ -z "${FRONT_ZST}" ] || [ ! -f "${FRONT_ZST}" ]; then
            echo "Missing split image artifacts (backend/frontend .tar.zst)"
            find /tmp -maxdepth 4 -type f -name 'maqder*' 2>/dev/null || true
            exit 1
          fi

          echo "=== rsync code to ${REMOTE}:${DEST} (sha=${BUILD_SHA}) ==="
          rsync -az --delete \
            -e "$RSYNC_CODE_RSH" \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude 'frontend/node_modules/' \
            --exclude 'backend/node_modules/' \
            --exclude 'frontend/dist/' \
            --exclude 'desktop/' \
            --exclude 'desktop/node_modules/' \
            --exclude 'backend/storage/' \
            --exclude 'backend/tmp/' \
            --exclude 'backend/logs/' \
            --exclude 'uploads/' \
            --exclude 'backups/' \
            --exclude 'tmp/' \
            --exclude 'logs/' \
            --exclude '.env' \
            --exclude '.env.local' \
            --exclude '.env.production' \
            --exclude '.cursor/' \
            --exclude 'agent-transcripts/' \
            --exclude 'maqder-app-images.tar.gz' \
            --exclude 'maqder-app-images.tar.zst' \
            --exclude 'maqder-backend.tar.zst' \
            --exclude 'maqder-frontend.tar.zst' \
            ./ "${REMOTE}:${DEST}/"

          echo "=== transfer pre-built images (NO rsync -z — already zstd; progress below) ==="
          ls -lh "$BACK_ZST" "$FRONT_ZST"

          echo "--- backend image ---"
          rsync -a --whole-file --inplace --info=progress2 \
            -e "$RSYNC_IMG_RSH" \
            "$BACK_ZST" \
            "${REMOTE}:/tmp/maqder-backend.tar.zst"

          echo "--- frontend image ---"
          rsync -a --whole-file --inplace --info=progress2 \
            -e "$RSYNC_IMG_RSH" \
            "$FRONT_ZST" \
            "${REMOTE}:/tmp/maqder-frontend.tar.zst"

          echo "Image transfer complete."

          echo "=== remote deploy.sh (prebuilt images, no Docker Hub) ==="
          set +e
          ssh "${SSH_BASE[@]}" "${REMOTE}" \
            "cd '${DEST}' && chmod +x deploy.sh && SKIP_GIT=1 USE_PREBUILT_IMAGES=1 BUILD_SHA='${BUILD_SHA}' ./deploy.sh"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "Remote deploy exited ${status} (255 = SSH never started the script)."
            exit "$status"
          fi
          ssh "${SSH_BASE[@]}" "${REMOTE}" \
            "rm -f /tmp/maqder-app-images.tar.gz /tmp/maqder-app-images.tar.zst /tmp/maqder-backend.tar.zst /tmp/maqder-frontend.tar.zst" || true
