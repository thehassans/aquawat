version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: maqder_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: maqder
    volumes:
      - mongo_data:/data/db
      - ./backups:/backups
    networks:
      - maqder_net
    # Do not expose 27017 outside the container network
    # Backend connects via service name: mongo

    # ── Resource limits ───────────────────────────────────────────────────────
    # Prevent MongoDB from consuming all RAM on a shared VPS.
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

    # ── Health check ──────────────────────────────────────────────────────────
    # Backend will only start once this passes, avoiding "MongoNotConnected"
    # errors on fast container restarts.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    # ── Log rotation ─────────────────────────────────────────────────────────
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: maqder_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/maqder
      NODE_ENV: production
      PORT: 3000
      # Performance env-vars (override in .env as needed)
      MONGODB_MAX_POOL_SIZE: "20"
      MONGODB_MIN_POOL_SIZE: "2"
      API_REQUEST_TIMEOUT_MS: "30000"
      AUTH_RATE_LIMIT_MAX: "30"
      PUBLIC_RATE_LIMIT_MAX: "1000"
      LOG_CONSOLE: "true"    # Forward logs to Docker log driver
    depends_on:
      mongo:
        condition: service_healthy   # Wait for Mongo healthcheck to pass
    networks:
      - maqder_net
    volumes:
      - ./uploads:/app/public/uploads

    # ── Resource limits ───────────────────────────────────────────────────────
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1.5G
        reservations:
          cpus: '0.25'
          memory: 256M

    # ── Health check ──────────────────────────────────────────────────────────
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

    # ── Log rotation ─────────────────────────────────────────────────────────
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: maqder_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy   # Wait for backend healthcheck to pass
    networks:
      - maqder_net
    ports:
      - "8080:80"
    # Plesk Docker proxy will forward host port 8080 to this container
    # /api is proxied internally to the backend container via upstream pool

    # ── Resource limits ───────────────────────────────────────────────────────
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M

    # ── Log rotation ─────────────────────────────────────────────────────────
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mongo_data:

networks:
  maqder_net:
    driver: bridge
