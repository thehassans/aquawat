worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    include       /etc/nginx/mime.types;
    default_type  text/html;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;

        # Keep 200 so Cloudflare does not replace this with its own 502 page.
        error_page 502 503 504 =200 /updating.html;

        location = /updating.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header Retry-After "30" always;
        }

        location = /MaqderFavicon.png {
            root /usr/share/nginx/html;
            add_header Cache-Control "public, max-age=86400" always;
        }

        location = /maqderbestlogo.png {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        location /api/ {
            set $upstream_app frontend;
            proxy_pass         http://$upstream_app:80;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout    300s;
            # Never rewrite API failures to the HTML updating page (fake HTTP 200).
            proxy_intercept_errors off;
            error_page 502 503 504 = @api_unavailable;
        }

        location /socket.io/ {
            set $upstream_app frontend;
            proxy_pass         http://$upstream_app:80;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_set_header   Host              $host;
            proxy_connect_timeout 3s;
            proxy_read_timeout    3600s;
            # Never rewrite WS failures to HTML 200 — browsers report
            # "WebSocket handshake: Unexpected response code: 200".
            proxy_intercept_errors off;
            error_page 502 503 504 = @socket_unavailable;
        }

        location @api_unavailable {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 503 '{"error":"Service temporarily unavailable","code":"UPSTREAM_UNAVAILABLE"}';
        }

        location @socket_unavailable {
            default_type text/plain;
            add_header Cache-Control "no-store" always;
            return 503 "Service temporarily unavailable";
        }

        location / {
            set $upstream_app frontend;
            proxy_pass         http://$upstream_app:80;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_connect_timeout 3s;
            proxy_read_timeout    300s;
            proxy_intercept_errors on;
        }
    }
}
